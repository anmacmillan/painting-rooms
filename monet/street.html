$('endText').innerHTML = `<p>In the summer of 1869 Claude Monet and Pierre-Auguste Renoir, both twenty-eight and both poor, set up their easels side by side at La Grenouillère, “the frog pond”: a floating café and bathing place moored at the island of Croissy on the Seine, about twelve kilometres west of Paris. They painted the same view from almost the same spot. Monet's picture is in the Metropolitan Museum of Art, New York; Renoir's is in the Nationalmuseum, Stockholm.</p>
  <p><b>Real:</b> the little round island with its one tree, which people called the Camembert and the Flowerpot; the gangplanks joining it to the bank and to the café; the café's wall, lettered for the hire of boats; the rowing boats moored in front; the bathers, the women in long black bathing dress; the sailing boats; the black coats, white trousers and tall hats. The Maison Fournaise at Chatou, where boats were hired from 1857, lies upstream: about a kilometre and a half by water, which this river shortens to under a third. That September Monet wrote to his friend Bazille: “I do have a dream, a painting, the baths of La Grenouillère, for which I have made some bad sketches, but it is only a dream. Renoir, who has just spent two months here, also wants to do this painting.” Those are his words, in the Metropolitan Museum's translation from the French.</p>
  <p><b>What you did:</b> you caught the light on the water with one dab of paint for each glint, before it moved. That is how these pictures were made. The National Gallery says of Monet's sketches here that they were “painted quickly”, on the spot, to “capture a moment of light”, and that the water is “filled with horizontal, square-ended, overlapping strokes, in greens and blues”, which “capture the ripples of the water”; the Metropolitan Museum calls the strokes in its picture “Morse-code-like dashes of blue, green, and black”. The glints you could click, and Monet's asking for your help, are the game's.</p>
  <p><b>Imagined:</b> you, your boat and your hiring it at Chatou; the look of the landing there, whose striped awning is borrowed from a picture Renoir painted at the Maison Fournaise twelve years later; the width and windings of the river and where everyone on it happens to be; the landing stage, the gold ring and the café's gangway; the painters' hats, and everything either of them says. Their faces and coats follow portraits of 1867. The letters of the sign that Monet hid behind a white cloth are a guess. Which arm of the Seine the café lay in, the sources do not agree, so the far bank here has no name.</p>`;
