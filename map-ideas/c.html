<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Painting Rooms — The Storybook Globe</title>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
  :root {
    --sky-top: #dce8ee;
    --sky-bot: #f4ecda;
    --paper: #f7f1e3;
    --ink: #241e17;
    --muted: #5d5142;
    --gold: #c9962e;
    --gold-bright: #f5ce6b;
    --vermilion: #b83a28;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #f8f3e6 0%, #e1ecee 54%, #c6dbe2 100%);
    color: var(--ink); font-family: var(--serif);
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas#globe {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab;
  }
  canvas#globe.dragging { cursor: grabbing; }

  /* Top bar: top-left explicitly reserved for Home button + "Who is playing" chip */
  header.top {
    position: fixed; top: 14px; left: 16px; right: 16px; z-index: 10;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    pointer-events: none;
  }
  .top-left {
    pointer-events: auto; display: flex; flex-direction: column; gap: 7px;
    min-width: 210px;
  }
  .player-slot {
    display: flex; align-items: center; gap: 7px;
  }
  .home-btn {
    display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
    background: rgba(248, 243, 231, 0.92); color: var(--ink);
    border: 1.5px solid rgba(72, 56, 36, 0.34); border-radius: 999px;
    padding: 6px 12px; font: 600 13px var(--serif);
    box-shadow: 0 3px 10px rgba(28, 36, 46, 0.12);
  }
  .who-chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: rgba(34, 46, 58, 0.90); color: #f6efe0;
    border: 1.5px solid rgba(201, 150, 46, 0.56); border-radius: 999px;
    padding: 6px 13px; font: 600 13px var(--serif);
    box-shadow: 0 3px 10px rgba(24, 32, 42, 0.16);
  }
  .who-chip .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--gold-bright);
  }
  .title-tag {
    background: rgba(248, 243, 231, 0.78); backdrop-filter: blur(6px);
    border: 1px solid rgba(72, 56, 36, 0.18); border-radius: 10px;
    padding: 4px 12px 5px; width: fit-content;
  }
  .title-tag h1 {
    margin: 0; font-size: clamp(17px, 2vw, 22px); font-weight: 600; line-height: 1.05;
  }
  .title-tag p {
    margin: 1px 0 0; font-size: 11.5px; font-style: italic; color: var(--muted);
  }

  .hud {
    pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center;
    justify-content: flex-end; gap: 7px 11px;
    background: rgba(28, 40, 52, 0.90); color: #f5efe2;
    border: 1px solid rgba(201, 150, 46, 0.54); border-radius: 999px;
    padding: 7px 14px; font-size: clamp(12px, 1.3vw, 13.5px);
    box-shadow: 0 5px 16px rgba(18, 28, 38, 0.18);
  }
  .hud b { color: var(--gold-bright); font-weight: 600; font-variant-numeric: tabular-nums; }
  .hud a, .hud button {
    color: #f4e2b2; text-decoration: none; font: inherit; background: none;
    border: 0; padding: 0; cursor: pointer;
  }
  .hud a:hover { text-decoration: underline; }
  .hud button.pill {
    border: 1px solid rgba(245, 206, 107, 0.48); border-radius: 999px;
    padding: 2px 9px; font-size: 0.88em; color: #f5efe2;
  }
  .hud button.pill:hover { background: rgba(201, 150, 46, 0.30); }

  /* Floating labels projected neatly over front-facing islands */
  #labels {
    position: fixed; inset: 0; z-index: 6; pointer-events: none; overflow: hidden;
  }
  .ilabel {
    position: absolute; transform: translate(-50%, 0);
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    font: 600 11.5px/1.3 var(--serif); color: #241d15;
    background: rgba(249, 244, 232, 0.88);
    border: 1px solid rgba(72, 56, 36, 0.30);
    box-shadow: 0 2px 6px rgba(24, 30, 38, 0.14);
    transition: opacity 0.15s;
  }
  .ilabel.active {
    background: #233344; color: #fff4d8; border-color: var(--gold-bright);
    font-size: 12.5px; z-index: 2;
  }
  .ilabel.done::after { content: " ★"; color: #c98d18; }
  .ilabel.active.done::after { color: var(--gold-bright); }
  .ilabel.next::before { content: "NEXT · "; color: var(--vermilion); font-size: 10px; }
  .ilabel.active.next::before { color: #ff9c88; }

  /* Compact floating place card above the timeline ribbon */
  .dock {
    position: fixed; left: 50%; bottom: 68px; transform: translateX(-50%); z-index: 12;
    width: min(600px, calc(100vw - 24px));
    background: rgba(249, 244, 232, 0.94); backdrop-filter: blur(8px);
    border: 1.5px solid rgba(86, 66, 38, 0.36); border-radius: 15px;
    box-shadow: 0 10px 26px rgba(20, 28, 36, 0.20);
    padding: 9px 13px; display: flex; align-items: center; gap: 12px;
  }
  .dock .thumb {
    width: 62px; height: 62px; flex: none; border-radius: 10px; overflow: hidden;
    background: #d8ceb8 center/cover no-repeat;
    border: 2px solid rgba(86, 66, 38, 0.4);
  }
  .dock .thumb.done { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,150,46,0.28); }
  .dock .meta { flex: 1; min-width: 0; }
  .dock .era {
    font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--vermilion); font-weight: 600;
  }
  .dock h2 {
    margin: 1px 0 0; font-size: clamp(16px, 2vw, 21px); line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock .sub {
    margin: 2px 0 0; font-size: 12.5px; font-style: italic; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock .prog { margin: 3px 0 0; font-size: 12px; color: #473d31; }
  .dock .prog .stars { color: #c48e1c; margin-right: 5px; }
  .dock .acts { display: flex; align-items: center; gap: 6px; flex: none; }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(72,56,36,0.3);
    background: rgba(255,252,244,0.92); color: var(--ink); font: 600 15px var(--serif);
    cursor: pointer; display: grid; place-items: center;
  }
  a.step-in, span.step-in {
    display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
    padding: 9px 16px; border-radius: 999px; font: 600 14.5px var(--serif);
    color: #231d14; background: linear-gradient(180deg, #f8da84, #dfa93e);
    border: 1px solid #b88422; box-shadow: 0 3px 10px rgba(130, 88, 18, 0.22);
    white-space: nowrap;
  }
  span.step-in.soon {
    background: rgba(46, 68, 92, 0.14); color: var(--muted);
    border-color: rgba(46, 68, 92, 0.28); box-shadow: none; font-style: italic;
  }

  /* Synchronised bottom timeline ribbon of the years (438 BC → 1908) */
  .timeline-wrap {
    position: fixed; left: 16px; right: 16px; bottom: 12px; z-index: 11;
    max-width: 1020px; margin: 0 auto;
    background: rgba(248, 242, 228, 0.92); backdrop-filter: blur(8px);
    border: 1.5px solid rgba(76, 58, 34, 0.34); border-radius: 999px;
    padding: 6px 12px; box-shadow: 0 5px 18px rgba(22, 30, 40, 0.14);
    display: flex; align-items: center; gap: 6px; overflow-x: auto;
    scrollbar-width: none; touch-action: pan-x;
  }
  .timeline-wrap::-webkit-scrollbar { display: none; }
  .t-chip {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 999px; border: 1.5px solid transparent;
    background: rgba(255, 252, 245, 0.72); color: #3c3227; cursor: pointer;
    font: 12px/1.15 var(--serif); white-space: nowrap; transition: transform 0.15s;
  }
  .t-chip .sw {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    border: 1px solid rgba(30, 24, 18, 0.28);
  }
  .t-chip.done { background: rgba(242, 204, 108, 0.26); color: #5c3e08; }
  .t-chip.active {
    background: #223243; color: #fff4d8; border-color: var(--gold-bright);
    font-weight: 600; transform: scale(1.04);
  }
  .t-chip.soon { font-style: italic; border-style: dashed; border-color: rgba(46, 72, 102, 0.36); }
  .t-sep { width: 1px; height: 18px; background: rgba(72, 56, 36, 0.25); flex: none; margin: 0 2px; }

  @media (max-width: 820px) {
    header.top { flex-direction: column; align-items: stretch; gap: 7px; }
    .top-left { flex-direction: row; align-items: center; justify-content: space-between; }
    .title-tag p { display: none; }
    .hud { justify-content: center; font-size: 12px; padding: 6px 11px; }
    .dock { bottom: 64px; padding: 8px 11px; gap: 9px; }
    .dock .thumb { width: 52px; height: 52px; }
  }
</style>
</head>
<body>
  <canvas id="globe"></canvas>
  <div id="labels"></div>

  <header class="top">
    <!-- Top-left explicitly reserved for Home button + "Who is playing" chip (Claude will wire player names & save slots) -->
    <div class="top-left">
      <div class="player-slot" id="playerSlot">
        <a class="home-btn" id="homeBtn" href="../arcade/" title="Back to Arcade">⌂ Home</a>
        <button class="who-chip" id="whoChip" data-slot="player-chip" title="Choose player">
          <span class="dot"></span><span id="whoName">Who is playing?</span>
        </button>
      </div>
      <div class="title-tag">
        <h1>Painting Rooms</h1>
        <p>spin the globe or slide the years · 438 BC – 1908</p>
      </div>
    </div>

    <div class="hud">
      <span><b id="hPts">0</b> pts</span>
      <span><b id="hPaint">0</b>/<span id="hPaintOf">0</span> paintings</span>
      <span><b id="hAges">0</b>/<span id="hAgesOf">0</span> ages</span>
      <a href="../book.html">Sketchbook</a>
      <button id="btnEdo" class="pill" title="Spin east to Edo, Japan">Edo ⛩</button>
      <button id="btnGardens" class="pill" title="Visit the two Garden Side Rooms">Garden rooms</button>
    </div>
  </header>

  <section class="dock" aria-live="polite">
    <div class="thumb" id="dThumb"></div>
    <div class="meta">
      <div class="era" id="dEra"></div>
      <h2 id="dTitle"></h2>
      <div class="sub" id="dSub"></div>
      <div class="prog" id="dProg"></div>
    </div>
    <div class="acts">
      <button class="nav-btn" id="btnPrev" aria-label="Previous stop">‹</button>
      <a class="step-in" id="btnGo" href="#">Step in ▶</a>
      <span class="step-in soon" id="btnSoon" style="display:none">Coming soon</span>
      <button class="nav-btn" id="btnNext" aria-label="Next stop">›</button>
    </div>
  </section>

  <nav class="timeline-wrap" id="timeline" aria-label="Years ribbon 438 BC to 1908"></nav>

<script type="module" src="./c-app.js"></script>
</body>
</html>
