<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Painting Rooms — The Illuminated Portolan Atlas</title>
<style>
  :root {
    --vellum: #f2ead7;
    --sea: #d3dfe2;
    --ink: #221d17;
    --muted: #5f5344;
    --gold: #c89632;
    --gold-bright: #f2cc6e;
    --vermilion: #b23b28;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--sea); color: var(--ink); font-family: var(--serif);
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas#atlas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab;
  }
  canvas#atlas.dragging { cursor: grabbing; }

  /* Delicate double-ruled antique atlas border around the viewport */
  .frame-border {
    position: fixed; inset: 7px; z-index: 4; pointer-events: none;
    border: 1.5px solid rgba(58, 46, 32, 0.36);
    box-shadow: inset 0 0 0 3px rgba(242, 234, 215, 0.55), inset 0 0 0 4.5px rgba(58, 46, 32, 0.22);
    border-radius: 4px;
  }

  header.top {
    position: fixed; top: 18px; left: 20px; right: 20px; z-index: 10;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    pointer-events: none;
  }
  .cartouche {
    pointer-events: auto;
    background: rgba(245, 238, 223, 0.90); backdrop-filter: blur(6px);
    border: 1.5px solid rgba(78, 58, 34, 0.36); border-radius: 10px;
    padding: 7px 14px 8px; box-shadow: 0 4px 14px rgba(24, 28, 34, 0.12);
  }
  .cartouche h1 {
    margin: 0; font-size: clamp(19px, 2.4vw, 27px); font-weight: 600;
    line-height: 1.05; color: var(--ink);
  }
  .cartouche p {
    margin: 2px 0 0; font-size: clamp(11px, 1.25vw, 13px); font-style: italic; color: var(--muted);
  }

  .hud {
    pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center;
    justify-content: flex-end; gap: 7px 12px;
    background: rgba(28, 39, 50, 0.90); color: #f4eee0;
    border: 1px solid rgba(200, 150, 50, 0.56); border-radius: 999px;
    padding: 7px 14px; font-size: clamp(12px, 1.3vw, 14px);
    box-shadow: 0 5px 16px rgba(18, 26, 36, 0.20);
  }
  .hud b { color: var(--gold-bright); font-weight: 600; font-variant-numeric: tabular-nums; }
  .hud a, .hud button {
    color: #f3e2b2; text-decoration: none; font: inherit; background: none;
    border: 0; padding: 0; cursor: pointer;
  }
  .hud a:hover { text-decoration: underline; }
  .hud button.pill {
    border: 1px solid rgba(242, 204, 110, 0.48); border-radius: 999px;
    padding: 2px 9px; font-size: 0.88em; color: #f4eee0;
  }
  .hud button.pill.on { background: rgba(200, 150, 50, 0.36); border-color: var(--gold-bright); color: #fff8e2; }

  /* Calm view controls (Atlas overview / Europe / Edo) */
  .view-bar {
    position: fixed; right: 20px; top: 72px; z-index: 10;
    display: flex; gap: 6px; pointer-events: auto;
  }
  .view-bar button {
    font: 600 12px var(--serif); color: var(--ink); cursor: pointer;
    background: rgba(245, 238, 223, 0.90); border: 1px solid rgba(72, 56, 36, 0.34);
    border-radius: 999px; padding: 5px 11px;
    box-shadow: 0 2px 8px rgba(24, 28, 34, 0.10);
  }
  .view-bar button.on { background: #263647; color: #f7eed6; border-color: var(--gold); }

  /* Place card */
  .dock {
    position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 12;
    width: min(610px, calc(100vw - 28px));
    background: rgba(248, 242, 228, 0.94); backdrop-filter: blur(8px);
    border: 1.5px solid rgba(88, 66, 38, 0.38); border-radius: 14px;
    box-shadow: 0 10px 26px rgba(20, 26, 34, 0.22);
    padding: 9px 14px; display: flex; align-items: center; gap: 12px;
  }
  .dock .thumb {
    width: 64px; height: 64px; flex: none; border-radius: 50%; overflow: hidden;
    background: #d8ceb8 center/cover no-repeat;
    border: 2px solid rgba(88,66,38,0.45);
  }
  .dock .thumb.done { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,150,50,0.30); }
  .dock .meta { flex: 1; min-width: 0; }
  .dock .era {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--vermilion); font-weight: 600;
  }
  .dock h2 {
    margin: 1px 0 0; font-size: clamp(17px, 2.1vw, 21px); line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock .sub {
    margin: 2px 0 0; font-size: 13px; font-style: italic; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock .prog { margin: 3px 0 0; font-size: 12px; color: #473d31; }
  .dock .prog .stars { color: #c48e1c; margin-right: 6px; }
  .dock .acts { display: flex; align-items: center; gap: 6px; flex: none; }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(72,56,36,0.3);
    background: rgba(255,252,244,0.9); color: var(--ink); font: 600 15px var(--serif);
    cursor: pointer; display: grid; place-items: center;
  }
  a.step-in, span.step-in {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    padding: 9px 17px; border-radius: 999px; font: 600 14.5px var(--serif);
    color: #231d14; background: linear-gradient(180deg, #f7d982, #dda83e);
    border: 1px solid #b88422; box-shadow: 0 3px 10px rgba(130, 88, 18, 0.22);
    white-space: nowrap;
  }
  span.step-in.soon {
    background: rgba(58, 72, 86, 0.14); color: var(--muted);
    border-color: rgba(58, 72, 86, 0.28); box-shadow: none; font-style: italic;
  }

  /* Slim chronological era ribbon along the foot of the atlas */
  .era-bar {
    position: fixed; left: 20px; right: 20px; bottom: 16px; z-index: 11;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    background: rgba(245, 238, 223, 0.88); backdrop-filter: blur(6px);
    border: 1px solid rgba(72, 56, 36, 0.28); border-radius: 999px;
    padding: 5px 12px; max-width: 960px; margin: 0 auto; overflow-x: auto;
  }
  .era-chip {
    flex: none; font: 11.5px var(--serif); padding: 3px 8px; border-radius: 999px;
    border: 1px solid transparent; background: transparent; color: var(--muted);
    cursor: pointer; white-space: nowrap;
  }
  .era-chip.done { color: #6a4a0c; background: rgba(232, 188, 76, 0.22); }
  .era-chip.active {
    background: #263647; color: #f8eed6; border-color: var(--gold); font-weight: 600;
  }
  .era-chip.preview { font-style: italic; }

  @media (max-width: 820px) {
    header.top { flex-direction: column; align-items: stretch; gap: 8px; }
    .hud { justify-content: center; font-size: 12px; padding: 6px 11px; }
    .view-bar { top: 126px; right: 16px; }
    .dock { bottom: 56px; padding: 8px 11px; gap: 9px; }
    .dock .thumb { width: 52px; height: 52px; }
    .era-bar { justify-content: flex-start; left: 14px; right: 14px; }
  }
</style>
</head>
<body>
  <div class="frame-border"></div>
  <canvas id="atlas"></canvas>

  <header class="top">
    <div class="cartouche">
      <h1>Painting Rooms</h1>
      <p>an atlas of art from the Atlantic to Edo, 438 BC – 1908</p>
    </div>
    <div class="hud">
      <span><b id="hPts">0</b> pts</span>
      <span><b id="hPaint">0</b>/<span id="hPaintOf">0</span> paintings</span>
      <span><b id="hAges">0</b>/<span id="hAgesOf">0</span> ages</span>
      <a href="../book.html">Sketchbook</a>
      <a href="../arcade/">Arcade</a>
      <button id="toggle21" class="pill" title="Preview forthcoming stops including Edo">21 stops</button>
    </div>
  </header>

  <div class="view-bar">
    <button id="vFollow" class="on">Follow</button>
    <button id="vEurope">Europe</button>
    <button id="vEurasia">Atlantic → Edo</button>
  </div>

  <section class="dock" aria-live="polite">
    <div class="thumb" id="dThumb"></div>
    <div class="meta">
      <div class="era" id="dEra"></div>
      <h2 id="dTitle"></h2>
      <div class="sub" id="dSub"></div>
      <div class="prog" id="dProg"></div>
    </div>
    <div class="acts">
      <button class="nav-btn" id="btnPrev" aria-label="Previous stop">‹</button>
      <a class="step-in" id="btnGo" href="#">Step in ▶</a>
      <span class="step-in soon" id="btnSoon" style="display:none">Coming soon</span>
      <button class="nav-btn" id="btnNext" aria-label="Next stop">›</button>
    </div>
  </section>

  <nav class="era-bar" id="eraBar" aria-label="Chronological stops"></nav>

<script type="module" src="./b-app.js"></script>
</body>
</html>
