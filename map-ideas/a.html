<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Painting Rooms — The Diachronic Scroll</title>
<style>
  :root {
    --paper: #f3ecdc;
    --ink: #251f18;
    --muted: #655848;
    --silk: #263342;
    --gold: #c99a3a;
    --gold-bright: #f0c966;
    --vermilion: #b83b29;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--paper); color: var(--ink); font-family: var(--serif);
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas#scroll {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab;
  }
  canvas#scroll.dragging { cursor: grabbing; }

  /* Calm silk scroll edging top & bottom */
  .silk-bar {
    position: fixed; left: 0; right: 0; height: 9px; z-index: 5; pointer-events: none;
    background: linear-gradient(90deg, #1f2b38, #2f4052 50%, #1f2b38);
    border-bottom: 1.5px solid rgba(201,154,58,0.65);
  }
  .silk-bar.bot {
    top: auto; bottom: 0; height: 8px;
    border-bottom: 0; border-top: 1.5px solid rgba(201,154,58,0.65);
  }

  /* Header */
  header.top {
    position: fixed; top: 14px; left: 16px; right: 16px; z-index: 10;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    pointer-events: none;
  }
  .brand {
    pointer-events: auto;
    background: rgba(243,236,220,0.82); backdrop-filter: blur(6px);
    padding: 7px 14px 8px; border-radius: 10px;
    border: 1px solid rgba(72,56,36,0.18);
  }
  .brand h1 {
    margin: 0; font-size: clamp(20px, 2.5vw, 28px); font-weight: 600;
    letter-spacing: 0.01em; line-height: 1.05; color: var(--ink);
  }
  .brand p {
    margin: 2px 0 0; font-size: clamp(11px, 1.3vw, 13px); font-style: italic;
    color: var(--muted);
  }

  .hud {
    pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center;
    justify-content: flex-end; gap: 8px 12px;
    background: rgba(34, 42, 52, 0.88); color: #f5efe2;
    border: 1px solid rgba(201, 154, 58, 0.52); border-radius: 999px;
    padding: 7px 15px; font-size: clamp(12px, 1.35vw, 14px);
    box-shadow: 0 4px 16px rgba(25, 20, 14, 0.16);
  }
  .hud b { color: var(--gold-bright); font-weight: 600; font-variant-numeric: tabular-nums; }
  .hud a, .hud button {
    color: #f3e3b4; text-decoration: none; font: inherit; background: none;
    border: 0; padding: 0; cursor: pointer;
  }
  .hud a:hover { text-decoration: underline; }
  .hud button.pill {
    border: 1px solid rgba(240, 201, 102, 0.48); border-radius: 999px;
    padding: 2px 9px; font-size: 0.88em; color: #f5efe2; transition: background 0.2s;
  }
  .hud button.pill.on { background: rgba(201, 154, 58, 0.34); color: #fff6dc; border-color: var(--gold-bright); }

  /* Place card */
  .dock {
    position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%); z-index: 12;
    width: min(620px, calc(100vw - 24px));
    background: rgba(248, 243, 231, 0.94); backdrop-filter: blur(8px);
    border: 1.5px solid rgba(92, 70, 40, 0.34); border-radius: 14px;
    box-shadow: 0 10px 28px rgba(32, 24, 15, 0.18), inset 0 1px 0 rgba(255,255,255,0.7);
    padding: 10px 14px; display: flex; align-items: center; gap: 13px;
  }
  .dock .thumb {
    width: 68px; height: 68px; flex: none; border-radius: 9px; overflow: hidden;
    background: #d8ceb8 center/cover no-repeat;
    border: 1.5px solid rgba(92,70,40,0.4); position: relative;
  }
  .dock .thumb.done { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,154,58,0.28); }
  .dock .meta { flex: 1; min-width: 0; }
  .dock .era {
    display: inline-block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--vermilion); font-weight: 600; margin-bottom: 1px;
  }
  .dock h2 {
    margin: 0; font-size: clamp(17px, 2.2vw, 22px); line-height: 1.15; font-weight: 600;
    color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock .sub {
    margin: 2px 0 0; font-size: 13.5px; font-style: italic; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock .prog { margin: 4px 0 0; font-size: 12.5px; color: #473d31; }
  .dock .prog .stars { color: #c48e1c; letter-spacing: 1px; margin-right: 6px; }

  .dock .acts { display: flex; align-items: center; gap: 7px; flex: none; }
  .nav-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(72,56,36,0.28);
    background: rgba(255,252,244,0.85); color: var(--ink); font: 600 15px var(--serif);
    cursor: pointer; display: grid; place-items: center;
  }
  .nav-btn:hover { background: #fff; border-color: var(--gold); }
  a.step-in, span.step-in {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    padding: 10px 18px; border-radius: 999px; font: 600 15px var(--serif);
    color: #231d14; background: linear-gradient(180deg, #f7d982, #dda83e);
    border: 1px solid #b88422; box-shadow: 0 3px 10px rgba(130, 88, 18, 0.22);
    white-space: nowrap;
  }
  span.step-in.soon {
    background: rgba(74, 88, 102, 0.14); color: var(--muted);
    border-color: rgba(74, 88, 102, 0.3); box-shadow: none; font-style: italic;
  }

  /* Calm bottom timeline ribbon */
  .ribbon {
    position: fixed; left: 16px; right: 16px; bottom: 13px; z-index: 11;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    pointer-events: auto;
  }
  .dot-btn {
    width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid rgba(58,46,34,0.45);
    background: rgba(243,236,220,0.85); padding: 0; cursor: pointer;
    transition: transform 0.2s, background 0.2s, border-color 0.2s;
  }
  .dot-btn.done { background: var(--gold); border-color: #8b6012; }
  .dot-btn.next { border-color: var(--vermilion); box-shadow: 0 0 0 2px rgba(184,59,41,0.22); }
  .dot-btn.active { transform: scale(1.42); background: var(--vermilion); border-color: #fff6e0; }
  .dot-btn.preview { border-style: dashed; }

  .hint {
    position: fixed; right: 18px; top: 68px; z-index: 9; pointer-events: none;
    font-size: 11.5px; font-style: italic; color: rgba(65, 52, 38, 0.70);
    background: rgba(243, 236, 220, 0.72); padding: 3px 10px; border-radius: 999px;
  }

  @media (max-width: 820px) {
    header.top { flex-direction: column; align-items: stretch; gap: 8px; }
    .hud { justify-content: center; font-size: 12.5px; padding: 6px 12px; }
    .hint { display: none; }
    .dock { bottom: 38px; padding: 9px 11px; gap: 10px; }
    .dock .thumb { width: 54px; height: 54px; }
  }
</style>
</head>
<body>
  <div class="silk-bar"></div>
  <canvas id="scroll"></canvas>

  <header class="top">
    <div class="brand">
      <h1>Painting Rooms</h1>
      <p>a scroll through two thousand years, a picture at a time</p>
    </div>
    <div class="hud">
      <span><b id="hPts">0</b> pts</span>
      <span><b id="hPaint">0</b>/<span id="hPaintOf">0</span> paintings</span>
      <span><b id="hAges">0</b>/<span id="hAgesOf">0</span> ages</span>
      <a href="../book.html">Sketchbook</a>
      <a href="../arcade/">Arcade</a>
      <button id="toggle21" class="pill" title="Preview forthcoming stops including Edo">21 stops</button>
    </div>
  </header>

  <div class="hint">Drag scroll · Tap a painting · ← → keys walk · Enter steps in</div>

  <section class="dock" aria-live="polite">
    <div class="thumb" id="dThumb"></div>
    <div class="meta">
      <div class="era" id="dEra"></div>
      <h2 id="dTitle"></h2>
      <div class="sub" id="dSub"></div>
      <div class="prog" id="dProg"></div>
    </div>
    <div class="acts">
      <button class="nav-btn" id="btnPrev" aria-label="Previous stop">‹</button>
      <a class="step-in" id="btnGo" href="#">Step in ▶</a>
      <span class="step-in soon" id="btnSoon" style="display:none">Coming soon</span>
      <button class="nav-btn" id="btnNext" aria-label="Next stop">›</button>
    </div>
  </section>

  <nav class="ribbon" id="ribbon" aria-label="Scroll stops"></nav>
  <div class="silk-bar bot"></div>

<script type="module" src="./a-app.js"></script>
</body>
</html>
