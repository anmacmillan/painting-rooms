<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painting Rooms: a journey through time</title>
<style>
  :root { --paper:#f4efe2; --gold:#f2c865; --ink:#23262c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--paper); font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; text-align:center; padding:clamp(18px,3vw,40px) 16px 56px;
    background:radial-gradient(1200px 600px at 50% -10%, #5a4a3a 0%, rgba(90,74,58,0) 70%), linear-gradient(#2a2d34, #1f2228); }
  a { color:inherit; }
  h1 { font-weight:400; font-size:clamp(34px,6.5vw,72px); margin:0; letter-spacing:.01em; }
  .sub { font-style:italic; opacity:.8; margin:.3em 0 1.2em; font-size:clamp(16px,2.2vw,24px); }
  #progress { display:inline-flex; flex-wrap:wrap; gap:.4em 1.6em; justify-content:center; align-items:center; background:rgba(0,0,0,.28); border:1px solid rgba(242,200,101,.4); border-radius:999px; padding:.5em 1.4em; font-size:clamp(15px,1.9vw,21px); }
  #progress b { color:var(--gold); font-size:1.5em; font-weight:600; font-variant-numeric:tabular-nums; }
  #go { display:inline-block; margin:1.1em 0 .4em; text-decoration:none; font-size:clamp(20px,2.8vw,30px); color:var(--ink); background:linear-gradient(#ffe08a, #f2c865); border-radius:999px; padding:.55em 1.6em; box-shadow:0 10px 26px rgba(0,0,0,.45), inset 0 -3px 0 rgba(0,0,0,.15); }
  #go:active { transform:translateY(2px); }
  /* the journey: a map of the road on the left, the stops in order of time on the right; any stop may be played at any time */
  .journey { max-width:1400px; margin:clamp(20px,3vw,36px) auto 0; display:grid; grid-template-columns:minmax(0, 1.05fr) minmax(0, 1fr); gap:clamp(16px,2.4vw,36px); align-items:start; text-align:left; }
  #map { width:100%; height:auto; display:block; border-radius:18px; background:#22364a; box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 2px rgba(242,200,101,.35); }
  #map .land { fill:#d8c79c; stroke:#8a744a; stroke-width:1.2; } #map .route { fill:none; stroke:#f2c865; stroke-width:6; stroke-dasharray:2 14; stroke-linecap:round; } #map .route.done { stroke-dasharray:none; stroke:#ffe08a; stroke-width:5; opacity:.95; }
  #map a { cursor:pointer; } #map .ring { fill:none; stroke:#c7a24c; stroke-width:6; } #map .done .ring { stroke:#ffe08a; } #map .next .ring { stroke:#fff; }
  #map .pulse { fill:none; stroke:#fff; stroke-width:4; opacity:.8; transform-origin:center; transform-box:fill-box; animation:pulse 1.6s ease-out infinite; } @keyframes pulse { from { transform:scale(1); opacity:.8; } to { transform:scale(1.9); opacity:0; } }
  #map text { font-family:"Iowan Old Style",Palatino,Georgia,serif; fill:#fff8ea; paint-order:stroke; stroke:#1a2430; stroke-width:6px; stroke-linejoin:round; } #map .pl { font-size:30px; } #map .yr { font-size:22px; fill:#ffe08a; } #map .num { font-size:24px; font-weight:700; fill:#23262c; stroke:none; }
  #map .sea { font-size:26px; font-style:italic; fill:#7f9bb0; stroke:none; letter-spacing:.3em; }
  .stops { display:flex; flex-direction:column; gap:clamp(8px,1vw,14px); } .stops h2 { margin:.1em 0 .3em; text-align:left; }
  a.stop { display:grid; grid-template-columns:auto clamp(64px,7vw,96px) 1fr auto; gap:clamp(10px,1.2vw,18px); align-items:center; text-decoration:none; padding:clamp(8px,1vw,12px) clamp(10px,1.2vw,16px); border-radius:16px; background:rgba(255,255,255,.06); border:2px solid transparent; transition:transform .15s, background .15s; }
  a.stop:hover, a.stop:focus, a.stop.hot { background:rgba(255,255,255,.12); transform:translateX(4px); } a.stop.next { border-color:var(--gold); background:rgba(242,200,101,.12); }
  .stop .n { width:2em; height:2em; line-height:2em; border-radius:50%; text-align:center; background:#3a3f48; font-size:clamp(14px,1.5vw,18px); } .stop.done .n { background:var(--gold); color:var(--ink); font-weight:700; }
  .stop .th { aspect-ratio:1; background:#111 center/cover; border:4px solid #c7a24c; }
  .stop b { display:block; font-weight:400; font-size:clamp(18px,2.1vw,26px); line-height:1.15; } .stop i { display:block; opacity:.75; font-size:clamp(12px,1.3vw,16px); } .stop .st { font-size:clamp(12px,1.35vw,16px); margin-top:.2em; } .stop .st span { color:var(--gold); }
  .stop .playb { font-size:clamp(13px,1.4vw,17px); background:linear-gradient(#ffe08a, #f2c865); color:var(--ink); border-radius:999px; padding:.35em 1em; white-space:nowrap; } .dots { letter-spacing:.2em; color:var(--gold); }
  .any { font-style:italic; opacity:.75; font-size:clamp(13px,1.4vw,16px); margin:.4em 0 0; }
  h2 { font-weight:400; font-style:italic; font-size:clamp(18px,2.4vw,26px); margin:2.4em 0 .8em; opacity:.85; }
  .side { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; } .side a { width:min(300px,44vw); text-decoration:none; } .side img { width:100%; aspect-ratio:1.5; object-fit:cover; border:8px solid var(--paper); box-shadow:8px 10px 22px rgba(0,0,0,.4); display:block; } .side span { display:block; margin-top:.5em; font-size:clamp(15px,1.8vw,19px); }
  .foot { margin-top:2.6em; font-size:clamp(14px,1.6vw,18px); opacity:.85; } .foot a { color:var(--gold); }
  @media (max-width:860px) { .journey { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <h1>Painting Rooms</h1>
  <p class="sub">one journey through six hundred years, a painting at a time</p>
  <div id="progress"></div><br>
  <a id="go" href="florence/street.html">Begin in Florence, 1283</a>
  <div class="journey">
    <svg id="map" role="img" aria-label="Map of the journey"></svg>
    <div class="stops" id="stops"><h2>The road, in order of time</h2></div>
  </div>

  <h2>Two small rooms off the road</h2>
  <div class="side">
    <a href="rousseau/"><img src="rousseau/painting.jpg" alt="Tropical Forest with Monkeys by Henri Rousseau"><span>Five Monkeys, after Rousseau</span></a>
    <a href="seurat/"><img src="seurat/painting.jpg" alt="A Sunday on La Grande Jatte by Georges Seurat"><span>Sunday on the Island, after Seurat</span></a>
  </div>
  <p class="foot"><a href="/arcade/">Back to the Arcade: all the games and the family board</a></p>

<script type="module">
  import { LEVELS, loadScores } from './common/score.js';
  const all = loadScores(), NS = 'http://www.w3.org/2000/svg', el = (t, a = {}, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const done = l => !!(all[l.key] && all[l.key].runs), nextIdx = LEVELS.findIndex(l => !done(l)); let total = 0, found = 0, of = 0;
  // the list of stops
  const stops = document.getElementById('stops'), rows = [];
  LEVELS.forEach((l, k) => { const r = all[l.key], d = done(l), n = d ? Math.min(l.paintings, r.paintings || 0) : 0; of += l.paintings; if (d) { total += r.best; found += n; }
    const a = document.createElement('a'); a.href = l.href; a.className = 'stop ' + (d ? 'done' : k === nextIdx ? 'next' : 'todo');
    a.innerHTML = `<span class="n">${d ? '✓' : k + 1}</span><span class="th" style="background-image:url(${l.img})"></span><span><b></b><i></i><span class="st"></span></span><span class="playb">${d ? 'Play again' : 'Play'} ▶</span>`;
    a.querySelector('b').textContent = `${l.place}, ${l.year}`; a.querySelector('i').textContent = `${l.title} · after ${l.by}`;
    a.querySelector('.st').innerHTML = d ? `<span class="dots">${'●'.repeat(n)}${'○'.repeat(l.paintings - n)}</span> best <span>${r.best}</span> points` : k === nextIdx ? 'next on the road' : `${l.paintings} paintings to find`;
    stops.append(a); rows.push(a); });
  const any = document.createElement('p'); any.className = 'any'; any.textContent = 'You can visit the stops in any order. The road only shows which came first.'; stops.append(any);
  document.getElementById('progress').innerHTML = `<span><b>${total}</b> points</span><span><b>${found}</b> of ${of} paintings found</span><span><b>${LEVELS.filter(done).length}</b> of ${LEVELS.length} ages travelled</span>`;
  const go = document.getElementById('go'); if (nextIdx > 0) { go.href = LEVELS[nextIdx].href; go.textContent = `Continue: ${LEVELS[nextIdx].place}, ${LEVELS[nextIdx].year}`; } else if (nextIdx < 0) { go.href = LEVELS[0].href; go.textContent = 'You have travelled the whole road. Go again and beat your best'; }
  // the map: the coast of western Europe (Natural Earth, public domain), the stops where they really are, and the road between them in order of time
  const E = await (await fetch('./common/europe.json')).json(), [W, Ea, S, N] = E.box, merc = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)), y0 = merc(S), y1 = merc(N);
  const P = ([lon, lat]) => [(lon - W) / (Ea - W) * E.w, (1 - (merc(lat) - y0) / (y1 - y0)) * E.h], map = document.getElementById('map'); map.setAttribute('viewBox', `0 0 ${E.w} ${E.h}`);
  const defs = el('defs'); map.append(defs, el('path', { class: 'land', d: E.land }));
  map.append(el('text', { class: 'sea', x: 150, y: 330, 'text-anchor': 'middle' }, 'ATLANTIC'), el('text', { class: 'sea', x: 470, y: 420, 'text-anchor': 'middle' }, 'NORTH SEA'));
  const pts = LEVELS.map(l => P(l.at)), curve = (a, b, k) => { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, o = Math.min(70, L * 0.22) * (k % 2 ? 1 : -1); return `M${a[0]},${a[1]} Q${mx - dy / L * o},${my + dx / L * o} ${b[0]},${b[1]}`; };
  for (let k = 0; k < pts.length - 1; k++) map.append(el('path', { class: 'route' + (done(LEVELS[k]) && done(LEVELS[k + 1]) ? ' done' : ''), d: curve(pts[k], pts[k + 1], k) }));
  LEVELS.forEach((l, k) => { const [x, y] = pts[k], R = 38, d = done(l), a = el('a', { href: l.href, class: d ? 'done' : k === nextIdx ? 'next' : 'todo' });
    const cp = el('clipPath', { id: 'c' + k }); cp.append(el('circle', { cx: x, cy: y, r: R })); defs.append(cp);
    if (k === nextIdx) a.append(el('circle', { class: 'pulse', cx: x, cy: y, r: R }));
    a.append(el('image', { href: l.img, x: x - R, y: y - R, width: R * 2, height: R * 2, preserveAspectRatio: 'xMidYMid slice', 'clip-path': `url(#c${k})` }), el('circle', { class: 'ring', cx: x, cy: y, r: R }));
    const bx = x - R * 0.72, by = y - R * 0.72; a.append(el('circle', { cx: bx, cy: by, r: 17, fill: d ? '#ffe08a' : '#f4efe2', stroke: '#23262c', 'stroke-width': 2 }), el('text', { class: 'num', x: bx, y: by + 8, 'text-anchor': 'middle' }, d ? '✓' : k + 1));
    // the name goes on whichever side is clear of the next pin
    const left = x > E.w * 0.62 || pts.some((q, j) => j !== k && q[0] > x && q[0] - x < 260 && Math.abs(q[1] - y) < 60), tx = left ? x - R - 12 : x + R + 12; a.append(el('text', { class: 'pl', x: tx, y: y - 2, 'text-anchor': left ? 'end' : 'start' }, l.place), el('text', { class: 'yr', x: tx, y: y + 26, 'text-anchor': left ? 'end' : 'start' }, l.year));
    a.addEventListener('mouseenter', () => rows[k].classList.add('hot')); a.addEventListener('mouseleave', () => rows[k].classList.remove('hot')); map.append(a); });
</script>
</body>
</html>
