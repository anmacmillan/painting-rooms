    rows.forEach((r, i) => r.classList.toggle('hot', i === here)); pins.forEach((p, i) => p.classList.toggle('here', i === here)); rows[here].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); free = null; try { localStorage.setItem(AT, String(here)); } catch (e) { /* private window */ } };
  function walkTo(k) { if (walking || k === here || k < 0 || k >= LEVELS.length) return; walking = true; free = null; card.classList.add('away'); const dir = k > here ? 1 : -1, hurry = Math.max(1, Math.abs(k - here) * 0.6);

  // the camera: the map covers the screen, and the view follows her, kept inside the map; a drag looks about until she next moves
  let free = null, dragged = false; const cam = { x: pts[here][0], y: pts[here][1] };
  const frame = () => { const sc = Math.max(innerWidth / E.w, innerHeight / E.h) * (innerWidth < 900 ? 1.25 : 1), w = innerWidth / sc, h = innerHeight / sc, tx = free ? free.x : pos.x, ty = free ? free.y : pos.y + h * 0.14, low = h * 0.34;      // the sea runs on below the map, so that the south is not hidden behind the pictures at the foot
    cam.x += (tx - cam.x) * 0.09; cam.y += (ty - cam.y) * 0.09; const x = Math.max(0, Math.min(E.w - w, cam.x - w / 2)), y = Math.max(0, Math.min(E.h - h + low, cam.y - h / 2)); map.setAttribute('viewBox', `${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`); frame.sc = sc; frame.w = w; frame.h = h; requestAnimationFrame(frame); };
  { let d0 = null; map.addEventListener('pointerdown', e => { d0 = { x: e.clientX, y: e.clientY, cx: Math.max(frame.w / 2, Math.min(E.w - frame.w / 2, cam.x)), cy: Math.max(frame.h / 2, Math.min(E.h - frame.h / 2, cam.y)) }; dragged = false; });
    addEventListener('pointermove', e => { if (!d0) return; const dx = e.clientX - d0.x, dy = e.clientY - d0.y; if (!dragged && Math.hypot(dx, dy) < 8) return; dragged = true; free = { x: Math.max(frame.w / 2, Math.min(E.w - frame.w / 2, d0.cx - dx / frame.sc)), y: Math.max(frame.h / 2, Math.min(E.h - frame.h / 2, d0.cy - dy / frame.sc)) }; cam.x = free.x; cam.y = free.y; });
    addEventListener('pointerup', () => { d0 = null; setTimeout(() => { dragged = false; }, 0); }); }
  // a little life on the sea: clouds that drift over, a ship that sails, short waves
  for (let k = 0; k < 5; k++) { const c = el('g', { class: 'cloud' }), y = 90 + k * 210, sc = 1 + (k % 3) * 0.5; for (const [dx, r] of [[0, 34], [38, 46], [84, 36], [46, 30]]) c.append(el('ellipse', { cx: dx * sc, cy: (r === 30 ? 14 : 0) * sc, rx: r * 1.5 * sc, ry: r * 0.62 * sc })); const an = el('animateTransform', { attributeName: 'transform', type: 'translate', from: `${-300} ${y}`, to: `${E.w + 300} ${y}`, dur: `${70 + k * 23}s`, begin: `${-k * 31}s`, repeatCount: 'indefinite' }); c.append(an); map.append(c); }
  for (const [lon, lat] of [[-9, 50], [-7, 43], [2, 58], [5, 40.5], [16, 37], [-10, 57], [19, 41], [-3, 46]]) { const [x, y] = P([lon, lat]), w = el('path', { class: 'wave', d: `M${x - 22},${y} q11,-9 22,0 q11,9 22,0` }); w.append(el('animate', { attributeName: 'opacity', values: '.1;.5;.1', dur: '4s', begin: `${-(x % 4)}s`, repeatCount: 'indefinite' })); map.insertBefore(w, map.querySelector('.rose')); }
  { const [x0, y0s] = P([-10.5, 48]), [x1, y1s] = P([-6, 37.2]), sh = el('g', { class: 'ship' }); sh.append(el('path', { d: 'M-22,0 L22,0 L15,11 L-15,11 Z', fill: '#5a3b22', stroke: '#2a1a10', 'stroke-width': 1.5 }), el('path', { d: 'M0,-2 L0,-40', stroke: '#2a1a10', 'stroke-width': 2.5 }), el('path', { d: 'M3,-38 Q24,-22 3,-6 Z', fill: '#f4efe2', stroke: '#2a1a10', 'stroke-width': 1.2 }), el('path', { d: 'M-3,-34 Q-18,-20 -3,-8 Z', fill: '#e6d7ae', stroke: '#2a1a10', 'stroke-width': 1.2 }));
    sh.append(el('animateTransform', { attributeName: 'transform', type: 'translate', values: `${x0} ${y0s};${x1} ${y1s};${x0} ${y0s}`, dur: '120s', repeatCount: 'indefinite' })); map.insertBefore(sh, map.querySelector('.rose')); }
  stand(pts[here][0], pts[here][1]); arrive(); frame();
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); walkTo(here + 1); } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); walkTo(here - 1); } else if ((e.key === 'Enter' || e.key === ' ') && !walking) { e.preventDefault(); location.href = LEVELS[here].href; } });
