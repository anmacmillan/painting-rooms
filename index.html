<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painting Rooms: a journey through time</title>
<style>
  :root { --paper:#f4efe2; --gold:#f2c865; --ink:#23262c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--paper); font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; text-align:center; padding:clamp(18px,3vw,40px) 16px 56px;
    background:radial-gradient(1200px 600px at 50% -10%, #5a4a3a 0%, rgba(90,74,58,0) 70%), linear-gradient(#2a2d34, #1f2228); }
  a { color:inherit; }
  h1 { font-weight:400; font-size:clamp(34px,6.5vw,72px); margin:0; letter-spacing:.01em; }
  .sub { font-style:italic; opacity:.8; margin:.3em 0 1.2em; font-size:clamp(16px,2.2vw,24px); }
  #progress { display:inline-flex; flex-wrap:wrap; gap:.4em 1.6em; justify-content:center; align-items:center; background:rgba(0,0,0,.28); border:1px solid rgba(242,200,101,.4); border-radius:999px; padding:.5em 1.4em; font-size:clamp(15px,1.9vw,21px); }
  #progress b { color:var(--gold); font-size:1.5em; font-weight:600; font-variant-numeric:tabular-nums; }
  #go { display:inline-block; margin:1.1em 0 .4em; text-decoration:none; font-size:clamp(20px,2.8vw,30px); color:var(--ink); background:linear-gradient(#ffe08a, #f2c865); border-radius:999px; padding:.55em 1.6em; box-shadow:0 10px 26px rgba(0,0,0,.45), inset 0 -3px 0 rgba(0,0,0,.15); }
  #go:active { transform:translateY(2px); }
  /* the journey: four stops on one line of time */
  .road { position:relative; max-width:1500px; margin:clamp(22px,3vw,40px) auto 0; display:grid; grid-template-columns:repeat(var(--n, 4), 1fr); gap:clamp(12px,2vw,28px); }
  .road::before { content:""; position:absolute; left:6%; right:6%; top:clamp(13px,1.6vw,19px); height:4px; background:linear-gradient(90deg, #c7a24c, #f2c865, #c7a24c); border-radius:2px; opacity:.8; }
  a.stop { position:relative; text-decoration:none; display:flex; flex-direction:column; align-items:center; }
  .year { position:relative; z-index:1; font-size:clamp(15px,1.8vw,21px); background:#2a2d34; border:2px solid #c7a24c; border-radius:999px; padding:.1em .8em; margin-bottom:.9em; font-variant-numeric:tabular-nums; }
  .stop.done .year { background:var(--gold); color:var(--ink); border-color:var(--gold); } .stop.next .year { box-shadow:0 0 0 6px rgba(242,200,101,.25); }
  .frame { width:100%; aspect-ratio:1.05; border:clamp(8px,1.1vw,14px) solid #c7a24c; border-image:linear-gradient(135deg, #e6c878, #8a6a2c, #e6c878) 1; background:#111 center/cover; box-shadow:0 14px 30px rgba(0,0,0,.5); transition:transform .2s; }
  a.stop:hover .frame, a.stop:focus .frame { transform:translateY(-4px) scale(1.02); }
  .stop.todo .frame { filter:saturate(.55) brightness(.75); } .stop.next .frame { filter:none; outline:3px solid var(--gold); outline-offset:5px; }
  .stop b { display:block; font-weight:400; font-size:clamp(18px,2.3vw,28px); margin-top:.7em; }
  .stop i { display:block; opacity:.75; font-size:clamp(13px,1.5vw,17px); }
  .stop .state { margin-top:.45em; font-size:clamp(13px,1.5vw,17px); min-height:2.6em; } .stop .state span { color:var(--gold); }
  .dots { letter-spacing:.25em; color:var(--gold); }
  h2 { font-weight:400; font-style:italic; font-size:clamp(18px,2.4vw,26px); margin:2.4em 0 .8em; opacity:.85; }
  .side { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; } .side a { width:min(300px,44vw); text-decoration:none; } .side img { width:100%; aspect-ratio:1.5; object-fit:cover; border:8px solid var(--paper); box-shadow:8px 10px 22px rgba(0,0,0,.4); display:block; } .side span { display:block; margin-top:.5em; font-size:clamp(15px,1.8vw,19px); }
  .foot { margin-top:2.6em; font-size:clamp(14px,1.6vw,18px); opacity:.85; } .foot a { color:var(--gold); }
  @media (max-width:760px) { .road { grid-template-columns:repeat(2, 1fr); } .road::before { display:none; } }
</style>
</head>
<body>
  <h1>Painting Rooms</h1>
  <p class="sub">one journey through six hundred years, a painting at a time</p>
  <div id="progress"></div><br>
  <a id="go" href="florence/street.html">Begin in Florence, 1283</a>
  <div class="road" id="road"></div>

  <h2>Two small rooms off the road</h2>
  <div class="side">
    <a href="rousseau/"><img src="rousseau/painting.jpg" alt="Tropical Forest with Monkeys by Henri Rousseau"><span>Five Monkeys, after Rousseau</span></a>
    <a href="seurat/"><img src="seurat/painting.jpg" alt="A Sunday on La Grande Jatte by Georges Seurat"><span>Sunday on the Island, after Seurat</span></a>
  </div>
  <p class="foot"><a href="/arcade/">Back to the Arcade: all the games and the family board</a></p>

<script type="module">
  import { LEVELS, loadScores } from './common/score.js';
  const all = loadScores(), road = document.getElementById('road'); let total = 0, found = 0, of = 0, nextIdx = LEVELS.findIndex(l => !(all[l.key] && all[l.key].runs));
  road.style.setProperty('--n', LEVELS.length);
  LEVELS.forEach((l, k) => {
    const r = all[l.key], done = !!(r && r.runs), a = document.createElement('a'); a.href = l.href; a.className = 'stop ' + (done ? 'done' : k === nextIdx ? 'next' : 'todo'); of += l.paintings;
    const n = done ? Math.min(l.paintings, r.paintings || 0) : 0; if (done) { total += r.best; found += n; }
    const y = document.createElement('span'); y.className = 'year'; y.textContent = (done ? '✓ ' : '') + l.year;
    const f = document.createElement('div'); f.className = 'frame'; f.style.backgroundImage = `url(${l.img})`;
    const b = document.createElement('b'); b.textContent = l.place; const i = document.createElement('i'); i.textContent = `${l.title} · after ${l.by}`;
    const s = document.createElement('div'); s.className = 'state';
    if (done) { const d = document.createElement('div'); d.className = 'dots'; d.textContent = '●'.repeat(n) + '○'.repeat(l.paintings - n); const t = document.createElement('div'); t.innerHTML = `best <span>${r.best}</span> points`; s.append(d, t); }
    else s.textContent = k === nextIdx ? 'next on the road' : `${l.paintings} paintings to find`;
    a.append(y, f, b, i, s); road.append(a);
  });
  const p = document.getElementById('progress'), go = document.getElementById('go');
  p.innerHTML = `<span><b>${total}</b> points</span><span><b>${found}</b> of ${of} paintings found</span><span><b>${LEVELS.filter(l => all[l.key] && all[l.key].runs).length}</b> of ${LEVELS.length} ages travelled</span>`;
  if (nextIdx > 0) { go.href = LEVELS[nextIdx].href; go.textContent = `Continue: ${LEVELS[nextIdx].place}, ${LEVELS[nextIdx].year}`; }
  else if (nextIdx < 0) { go.href = LEVELS[0].href; go.textContent = 'You have travelled the whole road. Go again and beat your best'; }
</script>
</body>
</html>
